<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Puzzle Engine</title>
    <style>
        /* Base App Styling */
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            background: var(--surface);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 2rem;
            max-width: 900px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 280px;
        }

        h1 { margin: 0; font-size: 1.5rem; }
        p { margin: 0; font-size: 0.9rem; line-height: 1.4; color: #475569; }
        select { padding: 8px; font-size: 1rem; }

        .control-panel { display: none; flex-direction: column; gap: 1rem; }
        .control-panel.active { display: flex; }
        
        .display-area { display: none; }
        .display-area.active { display: block; }

        button {
            background: #333;
            color: #fff;
            border: 1px solid #000;
            padding: 0.75rem 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background: #000; }
        
        button.secondary { background: #eee; color: #000; }
        button.secondary:active { background: #ccc; }

        .status-box {
            padding: 1rem;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }

        /* --- Triangulation Canvas Styling --- */
        canvas {
            background: #fff;
            border: 2px solid #cbd5e1;
            cursor: crosshair;
        }

        /* --- Lights Out Strict Monochromatic Styling --- */
        .lo-board {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 2px;
            background: #000000; /* Grid lines */
            border: 4px solid #000000;
            width: fit-content;
        }

        .lo-cell {
            width: 60px;
            height: 60px;
            background: #444444; /* Inactive state: Dark Gray */
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            font-size: 24px;
            font-weight: bold;
            color: #000000;
        }

        .lo-cell.on {
            background: #FFFFFF; /* Active state: Pure White */
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="controls">
            <h1>C++ Math Engine</h1>
            
            <select id="puzzle-select" onchange="switchPuzzle()">
                <option value="none">-- Select a Puzzle --</option>
                <option value="triangulation">Polygon Triangulation</option>
                <option value="lights-out">Lights Out (5x5)</option>
            </select>

            <div id="controls-triangulation" class="control-panel">
                <p>Click the canvas to plot vertices in a counter-clockwise direction. Do not cross the lines.</p>
                <button onclick="runTriangulation()">Triangulate Polygon</button>
                <button class="secondary" onclick="clearCanvas()">Clear Canvas</button>
                <div id="status-tri" class="status-box">Awaiting input...</div>
            </div>

            <div id="controls-lights-out" class="control-panel">
                <p>Click to toggle a square and its neighbors. Goal: Turn the entire board dark gray.</p>
                <button onclick="randomizeLightsOut()">Scramble Board</button>
                <button class="secondary" onclick="runLightsOutSolver()">Solve with Math Engine</button>
                <div id="status-lo" class="status-box">Awaiting input...</div>
            </div>
        </div>

        <div>
            <div id="display-triangulation" class="display-area">
                <canvas id="polyCanvas" width="500" height="400"></canvas>
            </div>
            
            <div id="display-lights-out" class="display-area">
                <div id="lo-grid" class="lo-board"></div>
            </div>
        </div>
    </div>

    <script src="puzzle_engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
